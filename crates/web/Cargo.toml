[package]
name = "sphynx_engine_web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
game = { path = "../../game" }
sphynx_core = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }

[features]
default = []
debug = ["game/debug", "sphynx_core/debug"]
