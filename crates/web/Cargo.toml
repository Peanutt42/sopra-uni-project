[package]
name = "sphynx_engine_web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
game = { path = "../../game" }
sphynx_core = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

[features]
default = []
debug = ["game/debug", "sphynx_core/debug"]

[lints]
workspace = true
